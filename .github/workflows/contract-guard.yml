name: Contract guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check contract-change policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 tools/contract-manifest.py --check-pr
          --base "$BASE_SHA" --head "$HEAD_SHA" --event "$GITHUB_EVENT_PATH"

      - name: Lint the contract set
        run: python3 tools/contract-lint.py

      - name: Check the contract manifest
        run: python3 tools/contract-manifest.py --check

      - name: Prove the contract-change gate
        run: python3 tools/contract-manifest.py --mutation-test
