name: Contract change visibility

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  contract-change-visibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require the contract-change label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_CONTRACT_CHANGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'contract-change') }}
        run: |
          guarded_paths=(
            .github/workflows/contract-guard.yml
            docs/contract.md
            docs/contract-grants.md
            docs/contract-boundaries.md
            docs/deltas.md
            docs/decisions.md
            docs/threat-model.md
            docs/negative-matrix.md
            docs/quality-bar.md
            fixtures
            schema
            tools/contract-lint.py
            tools/schema-check.py
          )

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "${guarded_paths[@]}"; then
            exit 0
          fi

          if [[ "$HAS_CONTRACT_CHANGE_LABEL" != "true" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "${guarded_paths[@]}" >&2
            echo "Guarded files changed. Discuss the change and add the contract-change label." >&2
            exit 1
          fi
