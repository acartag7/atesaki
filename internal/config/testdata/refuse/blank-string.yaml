# expect: B1.blank
# Entra, dedicated app registration, two routes onto one upstream with
# different audiences, catalogs, credentials, and policies.
apiVersion: atesaki/v1alpha1
kind: Gateway
metadata:
  name: corp
spec:
  externalBaseUrl: https://gw.example.com
  listen: 0.0.0.0:8443
  signingKeyRef: env:ATESAKI_SIGNING_KEY
  allowedHosts: [gw.example.com]
  allowedOrigins: [https://gw.example.com]
  trustProxyHeaders: true
  trustedProxies: [10.0.0.0/8]
  identity:
    provider: entra
    registration: dedicated
    tenantId: 00000000-0000-0000-0000-000000000000
    clientId: "   "
    clientSecretRef: env:ENTRA_CLIENT_SECRET
    redirectUri: https://gw.example.com/oauth/callback
    egressProfile: corp
    groupsToScopes:
      splunk-readers: [splunk.read]
      splunk-admins: [splunk.read, splunk.admin]
  clients:
    redirectAllowlist: [https://claude.ai/api/mcp/auth_callback]
  egress:
    profiles:
      corp: {proxy: fromEnv, caBundleRef: env:CORP_CA_BUNDLE}
      direct: {proxy: none}
  store: {path: /var/lib/atesaki/store.db}
  audit: {path: /var/log/atesaki/audit.jsonl}
---
apiVersion: atesaki/v1alpha1
kind: Route
metadata:
  name: splunk-read
spec:
  path: /splunk-read
  upstream:
    url: https://splunk.internal.example.com/mcp
    egressProfile: direct
    credential: {type: static-header, header: Authorization, scheme: Bearer, valueRef: env:SPLUNK_READ_TOKEN}
  scopes:
    catalog: [splunk.read]
  authz: {requireScope: splunk.read}
  grant:
    maxDuration: 28800
    policy:
      rules:
        - effect: allow
          when: {scopesSubsetOf: [splunk.read], subjectInGroup: splunk-readers}
    approvers: [splunk-admins]
---
apiVersion: atesaki/v1alpha1
kind: Route
metadata:
  name: splunk-admin
spec:
  path: /splunk-admin
  upstream:
    url: https://splunk.internal.example.com/mcp
    egressProfile: direct
    credential: {type: static-header, header: Authorization, scheme: Bearer, valueRef: env:SPLUNK_ADMIN_TOKEN}
  scopes:
    catalog: [splunk.read, splunk.admin]
  authz: {requireScope: splunk.admin}
  grant:
    maxDuration: 3600
    approvers: [splunk-admins]
